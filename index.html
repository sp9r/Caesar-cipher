<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗号化・復号化パスワード変換器</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>暗号化・復号化パスワード変換器</h1>

    <p class="security-note">
      新規暗号化には AES-256-GCM と PBKDF2-SHA-256 を使用します。
      以前の文字ずらし方式は安全な暗号ではないため、新規暗号化には使用せず、既存データの復号だけ互換対応します。
    </p>

    <form id="cipherForm" autocomplete="off">
      <label id="inputLabel" for="password">暗号化する文字列</label>
      <textarea
        id="password"
        name="password"
        required
        maxlength="32768"
        spellcheck="false"
        autocapitalize="none"
        autocomplete="off"
        placeholder="暗号化したい文字列"
      ></textarea>

      <label for="key">鍵</label>
      <input
        type="password"
        id="key"
        name="key"
        required
        maxlength="1024"
        spellcheck="false"
        autocapitalize="none"
        autocomplete="new-password"
        placeholder="新規暗号化は12文字以上を推奨"
      >

      <div class="radio-group" role="group" aria-label="処理モード">
        <label>
          <input type="radio" id="encrypt" name="mode" value="encrypt" checked>
          暗号化
        </label>
        <label>
          <input type="radio" id="decrypt" name="mode" value="decrypt">
          復号化
        </label>
      </div>

      <button type="submit">変換</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <h2>結果：</h2>
    <div class="result-container">
      <output id="result">---</output>
      <button type="button" id="copyButton" class="copy-btn" disabled>コピー</button>
    </div>
  </main>
</body>
</html>
